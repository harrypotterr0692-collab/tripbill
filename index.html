<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripBill – Driver Billing</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0D7A80">
  <!-- Bundled jsPDF delivery node via CDN -->
  <script src="https://cloudflare.com"></script>
  <style>
    :root {
      --primary: #0D7A80;
      --primary-hover: #0a5f63;
      --bg: #F4F7F6;
      --card-bg: #FFFFFF;
      --text: #2D3748;
      --border: #E2E8F0;
      --muted: #718096;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      padding: 16px;
    }

    header {
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      text-align: center;
    }

    header h1 {
      color: var(--primary);
      font-size: 22px;
      font-weight: 700;
    }

    .navigation-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 16px 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 1px dashed var(--border);
      font-weight: 700;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      background-color: #FCFDFD;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #FFFFFF;
    }

    textarea {
      resize: vertical;
      min-height: 50px;
    }

    .summary-box {
      background-color: #EBF8FA;
      border: 1px solid #BEE3E8;
      border-radius: 8px;
      padding: 12px;
      margin: 16px 0;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .summary-row.total {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #BEE3E8;
      font-weight: 700;
      font-size: 16px;
      color: var(--primary);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-secondary {
      background-color: #E2E8F0;
      color: #4A5568;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>TripBill Generator</h1>
    </header>

    <div class="navigation-tabs">
      <button class="tab-btn active" id="tab-bill" onclick="switchTab('bill')">New Bill</button>
      <button class="tab-btn" id="tab-config" onclick="switchTab('config')">Company Setup</button>
    </div>

    <!-- BILLING FORM LAYOUT -->
    <div id="form-billing-section">
      <div class="grid-2">
        <div class="form-group">
          <label>Currency</label>
          <select id="currency" onchange="calculateTotal()">
            <option value="₹">Indian Rupee (₹)</option>
            <option value="$">USD ($)</option>
            <option value="€">Euro (€)</option>
            <option value="£">Pound (£)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Payment Method</label>
          <select id="payment-method">
            <option value="Cash">Cash</option>
            <option value="UPI / Online">UPI / Online</option>
            <option value="Card">Card</option>
          </select>
        </div>
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label>Trip Amount</label>
          <input type="number" id="trip-amount" value="0" oninput="calculateTotal()">
        </div>
        <div class="form-group">
          <label>Tax (%)</label>
          <input type="number" id="tax-percent" value="0" oninput="calculateTotal()">
        </div>
        <div class="form-group">
          <label>Conv. Fee</label>
          <input type="number" id="convenience-fee" value="0" oninput="calculateTotal()">
        </div>
      </div>

      <div class="form-group">
        <label>Airport Pickup Charge</label>
        <input type="number" id="airport-charge" value="0" oninput="calculateTotal()">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="trip-date">
        </div>
        <div class="form-group">
          <label>Invoice No</label>
          <input type="text" id="invoice-no" readonly>
        </div>
      </div>

      <div class="form-group">
        <label>Cab Service Address</label>
        <textarea id="service-address" placeholder="Enter service office address..."></textarea>
      </div>

      <div class="section-title">Vehicle Details</div>
      
      <div class="grid-2">
        <div class="form-group">
          <label>Vehicle Number</label>
          <input type="text" id="vehicle-no" placeholder="E.g. MH-12-XX-1234">
        </div>
        <div class="form-group">
          <label>Vehicle Model</label>
          <input type="text" id="vehicle-model" placeholder="Sedan, SUV, Hatchback">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Total Distance (KM)</label>
          <input type="number" id="total-distance" placeholder="Distance">
        </div>
        <div class="form-group">
          <label>Mobile No</label>
          <input type="tel" id="mobile-no" placeholder="Customer mobile">
        </div>
      </div>

      <div class="section-title">Location Details</div>

      <div class="grid-2">
        <div class="form-group">
          <label>Pick Up Point</label>
          <input type="text" id="pickup-point" placeholder="Start address">
        </div>
        <div class="form-group">
          <label>Drop Point</label>
          <input type="text" id="drop-point" placeholder="End address">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Pick Up Time</label>
          <input type="time" id="pickup-time">
        </div>
        <div class="form-group">
          <label>Drop Point Time</label>
          <input type="time" id="drop-time">
        </div>
      </div>

      <div class="summary-box">
        <div class="summary-row">
          <span>Subtotal:</span>
          <span id="lbl-subtotal">₹ 0.00</span>
        </div>
        <div class="summary-row">
          <span>Tax Amount:</span>
          <span id="lbl-tax">₹ 0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total Bill:</span>
          <span id="lbl-total">₹ 0.00</span>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-secondary" onclick="resetForm()">Clear</button>
        <button class="btn btn-primary" onclick="generatePDFInvoice()">Generate Bill</button>
      </div>
    </div>

    <!-- CONFIGURATION SETUP LAYOUT -->
    <div id="form-config-section" class="hidden">
      <div class="form-group">
        <label>Company / Operator Name</label>
        <input type="text" id="cfg-name" placeholder="E.g. Star Travels">
      </div>
      <div class="form-group">
        <label>Default Tax Percentage (%)</label>
        <input type="number" id="cfg-tax" value="0">
      </div>
      <div class="form-group">
        <label>Default Convenience Fee</label>
        <input type="number" id="cfg-fee" value="0">
      </div>
      <div class="form-group">
        <label>Default Cab Service Address</label>
        <textarea id="cfg-address" placeholder="Standard company registration address..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="saveSettings()">Save Configuration</button>
    </div>

  </div>

  <!-- APPLICATION CONTROLLER SCRIPT -->
  <script>
    // Initialize defaults on runtime lifecycle execution
    document.getElementById('trip-date').valueAsDate = new Date();
    generateInvoiceNumber();
    loadSettings();

    function generateInvoiceNumber() {
      const randNum = Math.floor(100000 + Math.random() * 900000);
      document.getElementById('invoice-no').value = randNum;
    }

    function switchTab(type) {
      if (type === 'bill') {
        document.getElementById('tab-bill').classList.add('active');
